<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Stats Bot - Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .status-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        p {
            color: #666;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .badge {
            display: inline-block;
            padding: 10px 20px;
            background: #10b981;
            color: white;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 20px;
        }
        .info {
            background: #f3f4f6;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            text-align: left;
        }
        .info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .info ul {
            list-style: none;
            color: #555;
        }
        .info li {
            padding: 5px 0;
        }
        .info li:before {
            content: "✓ ";
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-icon">🤖</div>
        <h1>CS2 Stats Bot</h1>
        <p>Seu assistente de estatísticas do Discord está online e funcionando!</p>
        <div class="badge">ONLINE</div>
        
        <div class="info">
            <h3>Sobre o Bot</h3>
            <ul>
                <li>Rastreamento de estatísticas de jogadores</li>
                <li>Análise de partidas e mapas</li>
                <li>Integração com Discord</li>
                <li>Conexão segura via HTTPS</li>
            </ul>
        </div>
    </div>
</body>
</html>
